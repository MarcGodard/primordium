[package]
name = "primordium-core"
edition.workspace = true
version.workspace = true

[features]
# The 14-element table (shells [2, 6, 6]) instead of this world's [2, 6]: see docs/bigger-table.md.
shells-266 = []
# 20 elements, [2, 6, 6, 6]. Pick at most one table feature.
shells-2666 = []
# Our own octets, [2, 8, 8]: tetravalent backbone, each link one letter plus an Hy cap.
shells-288 = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
