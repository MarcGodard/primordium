[package]
name = "primordium-godot"
edition.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
shells-266 = ["primordium-core/shells-266"]
shells-2666 = ["primordium-core/shells-2666"]

[dependencies]
primordium-core = { path = "../core" }
serde_json = "1"
godot = { version = "0.5.5", features = ["api-4-7"] }
